name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly at 07:00 UTC (23:00 in Vancouver during standard time).
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      repeat_each:
        description: Run every test this many times (flakiness check)
        default: '1'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  static:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Tests on ${{ matrix.name }} (Docker Compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # The in-memory broker: the reference behaviour.
          - name: memory
            bus: memory
            compose_file: docker-compose.yml
          # The same suite on Kafka, plus the Kafka-only project. Retries in place.
          - name: kafka
            bus: kafka
            retry_mode: blocking
            compose_file: docker-compose.yml:docker-compose.kafka.yml
          # Kafka with non-blocking retries through retry topics.
          - name: kafka-retry-topics
            bus: kafka
            retry_mode: topics
            compose_file: docker-compose.yml:docker-compose.kafka.yml
    env:
      CI: 'true'
      BUS: ${{ matrix.bus }}
      # Read by docker-compose.kafka.yml and by the tests (which Kafka tests to run).
      KAFKA_RETRY_MODE: ${{ matrix.retry_mode || 'blocking' }}
      # docker compose reads the file list from here (":"-separated on Linux).
      COMPOSE_FILE: ${{ matrix.compose_file }}
      # Setting LOYALTY_URL tells Playwright the stack is already running, so
      # it does not start the services itself. The tests run against the
      # containers, the same way they would against a shared test environment.
      LOYALTY_URL: http://localhost:3001
      CDP_URL: http://localhost:3002
      NOTIFICATION_URL: http://localhost:3003
      BROKER_URL: http://localhost:3004
      BROKER_MAX_ATTEMPTS: '4'
      # The nightly run repeats every test to catch flaky ones; pushes run once.
      REPEAT_EACH: ${{ github.event_name == 'schedule' && '3' || inputs.repeat_each || '1' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Start the system under test
        run: docker compose up --build --detach --wait --wait-timeout 180

      # API tests need no browser, so there is no `playwright install` step.
      - name: Run tests
        run: |
          if [ "$BUS" = kafka ] && [ "$REPEAT_EACH" != 1 ]; then
            # Playwright does not repeat projects that another project depends
            # on, and the kafka project depends on all the others (it must run
            # alone). So repeated runs go in two parts.
            status=0
            npx playwright test --project=contract --project=api --project=events \
              --project=integrity --project=notifications --repeat-each "$REPEAT_EACH" || status=$?
            PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/kafka-project \
              npx playwright test --project=kafka --no-deps --repeat-each "$REPEAT_EACH" \
              --output test-results/kafka-project || status=$?
            exit $status
          else
            npx playwright test --repeat-each "$REPEAT_EACH"
          fi

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --timestamps > service-logs.txt

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.name }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test results and service logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.name }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            test-results/
            service-logs.txt
          retention-days: 14

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
